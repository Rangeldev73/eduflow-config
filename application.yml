spring:
  cloud:
    refresh:
      extra-refreshable: none
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,busrefresh
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    refresh:
      enable: false

platform:
  announcement: "Teste final - Spring Cloud Bus funcionando!"